name = "tayunxing-api"
main = "src/index.js"
compatibility_date = "2024-06-01"

# D1 数据库 — 创建后替换 binding 和 database_id
# wrangler d1 create tayunxing-db
[[d1_databases]]
binding = "DB"
database_name = "tayunxing-db"
database_id = "dedfad8a-687e-4e46-924f-3e54adf5a757"

# CORS — 替换为你的 Cloudflare Pages 域名
[vars]
CORS_ORIGIN = "http://localhost:5173"
JWT_SECRET = "tayunxing-jwt-secret-change-in-production"
